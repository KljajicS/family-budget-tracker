name: android
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUDGET_KEYSTORE_PATH: ${{ runner.temp }}/budget-release.keystore
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore distribution signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.BUDGET_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing distribution signing key'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$BUDGET_KEYSTORE_PATH"
      - run: make lint test release
        env:
          BUDGET_KEYSTORE_PASSWORD: ${{ secrets.BUDGET_KEYSTORE_PASSWORD }}
          BUDGET_KEY_ALIAS: ${{ secrets.BUDGET_KEY_ALIAS }}
          BUDGET_KEY_PASSWORD: ${{ secrets.BUDGET_KEY_PASSWORD }}
      - uses: softprops/action-gh-release@v3
        with:
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$BUDGET_KEYSTORE_PATH"
